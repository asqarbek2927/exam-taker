services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examtaker}
      POSTGRES_USER: ${POSTGRES_USER:-examtaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examtaker} -d ${POSTGRES_DB:-examtaker}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env.aws
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "1"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      NUM_PROXIES: "1"
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
    expose:
      - "8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  finalizer:
    build: .
    restart: unless-stopped
    env_file: .env.aws
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "0"
      NUM_PROXIES: "1"
      SECURE_SSL_REDIRECT: "false"
      SESSION_COOKIE_SECURE: "false"
      CSRF_COOKIE_SECURE: "false"
      SECURE_HSTS_SECONDS: "0"
    command:
      [
        "sh",
        "-c",
        "while true; do python manage.py finalize_expired_attempts; sleep 60; done",
      ]
    volumes:
      - media_data:/app/media
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-http.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
