        course:
          allOf:
          - $ref: '#/components/schemas/CourseBrief'
          readOnly: true
        published_by:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        audience_type:
          allOf:
          - $ref: '#/components/schemas/AudienceTypeEnum'
          readOnly: true
        availability_type:
          allOf:
          - $ref: '#/components/schemas/AvailabilityTypeEnum'
          readOnly: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentGroup'
          readOnly: true
        students:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentStudent'
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_minutes:
          type: integer
          readOnly: true
        max_attempts:
          type: integer
          readOnly: true
          nullable: true
        result_review_mode:
          allOf:
          - $ref: '#/components/schemas/ResultReviewModeEnum'
          readOnly: true
        answer_review_released:
          type: boolean
          readOnly: true
        answer_review_released_at:
          type: string
          format: date-time
