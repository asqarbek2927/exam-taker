components:
  schemas:
    ActiveArchivedStatusEnum:
      enum:
      - ACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `ARCHIVED` - Archived
    AdminDashboard:
      type: object
      properties:
        total_students:
          type: integer
        total_teachers:
          type: integer
        total_courses:
          type: integer
        total_modules:
          type: integer
        total_questions:
          type: integer
        total_exams:
          type: integer
        active_assignments:
          type: integer
        completed_assignments:
          type: integer
        average_score:
          type: number
          format: double
          nullable: true
        pass_rate:
          type: number
          format: double
          nullable: true
      required:
      - active_assignments
      - average_score
      - completed_assignments
      - pass_rate
      - total_courses
      - total_exams
      - total_modules
      - total_questions
      - total_students
      - total_teachers
    Answer:
      type: object
      properties:
        exam_question_id:
          type: string
          format: uuid
          readOnly: true
        option_ids:
          type: array
          items: {}
          readOnly: true
        text_answer:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - exam_question_id
      - option_ids
      - text_answer
      - updated_at
    AnswerInputRequest:
      type: object
      description: 'Tanlovli savol: `option_ids` (bo‘sh ro‘yxat — tozalash). OPEN_ENDED:
        `text_answer`.'
      properties:
        option_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 50
        text_answer:
          type: string
          maxLength: 20000
    ArchivedResponse:
      type: object
      description: '`DELETE` obyekt arxivlanganda qaytadigan javob (faqat OpenAPI
        sxemasi uchun).'
      properties:
        archived:
          type: boolean
      required:
      - archived
    Assignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam:
          allOf:
          - $ref: '#/components/schemas/ExamBrief'
          readOnly: true
        course:
          allOf:
          - $ref: '#/components/schemas/CourseBrief'
          readOnly: true
        published_by:
          allOf:
          - $ref: '#/components/schemas/UserBrief'
          readOnly: true
        audience_type:
          allOf:
          - $ref: '#/components/schemas/AudienceTypeEnum'
          readOnly: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentGroup'
          readOnly: true
        students:
          type: array
          items:
            $ref: '#/components/schemas/AssignmentStudent'
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration_minutes:
          type: integer
          readOnly: true
        max_attempts:
          type: integer
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssignmentStatusEnum'
          readOnly: true
        stored_status:
          allOf:
          - $ref: '#/components/schemas/StoredAssignmentStatusEnum'
          readOnly: true
        attempts_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - attempts_count
      - audience_type
      - course
      - created_at
      - duration_minutes
      - end_at
      - exam
      - groups
      - id
      - max_attempts
      - published_by
      - start_at
      - status
      - stored_status
      - students
      - updated_at
    AssignmentCreateRequest:
      type: object
      description: '`audience_type` bilan `group_ids` / `student_ids` mosligi (shakl
        darajasida, 422).'
      properties:
        exam_id:
          type: string
          format: uuid
        audience_type:
          $ref: '#/components/schemas/AudienceTypeEnum'
        group_ids:
          type: array
          items:
            type: string
            format: uuid
        student_ids:
          type: array
          items:
            type: string
            format: uuid
        start_at:
