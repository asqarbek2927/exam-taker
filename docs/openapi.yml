components:
  schemas:
    AcademicStudentCourseCard:
      type: object
      properties:
        course_id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        teacher_names:
          type: array
          items:
            type: string
          readOnly: true
        module_count:
          type: integer
          readOnly: true
        progress:
          type: number
          format: double
          nullable: true
          readOnly: true
        next_step:
          type: string
          readOnly: true
      required:
      - course_id
      - description
      - module_count
      - next_step
      - progress
      - status
      - teacher_names
      - title
    AccountActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        metadata: {}
        created_at:
          type: string
          format: date-time
      required:
      - action
      - actor_id
      - created_at
      - id
      - metadata
    AccountCourse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
        teacher_type:
          type: string
        enrolled_at:
          type: string
          format: date-time
        teacher_name:
          type: string
          nullable: true
        progress:
          type: number
          format: double
          maximum: 100
          minimum: 0
          nullable: true
        groups_count:
          type: integer
        students_count:
          type: integer
      required:
      - groups_count
      - id
      - name
      - status
      - students_count
    ActiveArchivedStatusEnum:
      enum:
      - ACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `ARCHIVED` - Archived
    AdminAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        assigned_courses:
          type: array
          items:
            $ref: '#/components/schemas/AdminAssignedCourse'
          readOnly: true
        courses_count:
          type: integer
          readOnly: true
        students_count:
          type: integer
          readOnly: true
        exams_count:
          type: integer
          readOnly: true
      required:
      - assigned_courses
      - avatar_url
      - courses_count
      - created_at
      - email
      - exams_count
      - full_name
      - id
      - location
      - must_change_password
      - phone_number
      - role
      - status
      - students_count
      - updated_at
      - username
      - version
    AdminAccountCreateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/CreatableUserRoleEnum'
        avatar_url:
          writeOnly: true
          oneOf:
          - type: string
            format: uri
            default: ''
          - type: string
            maxLength: 0
        phone_number:
          oneOf:
          - type: string
            default: ''
            pattern: ^\+998\d{9}$
          - type: string
            maxLength: 0
        location:
          type: string
          default: ''
          maxLength: 255
      required:
      - email
      - full_name
      - role
    AdminAccountCreateResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/AdminAccountDetail'
        temporary_password:
          type: string
        temporary_password_expires_at:
          type: string
          format: date-time
      required:
      - account
      - temporary_password
      - temporary_password_expires_at
    AdminAccountDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        phone_number:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        avatar_url:
          type: string
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
        assigned_courses:
          type: array
          items:
            $ref: '#/components/schemas/AdminAssignedCourse'
          readOnly: true
        courses_count:
          type: integer
          readOnly: true
        students_count:
          type: integer
          readOnly: true
        exams_count:
          type: integer
          readOnly: true
        courses:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        groups:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        exam_stats:
          type: object
          additionalProperties:
            type: integer
          readOnly: true
        last_active:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - assigned_courses
      - avatar_url
      - courses
      - courses_count
      - created_at
      - email
      - exam_stats
      - exams_count
      - full_name
      - groups
      - id
      - last_active
      - location
      - must_change_password
      - phone_number
      - role
      - status
      - students_count
      - updated_at
      - username
      - version
    AdminAccountRoleSummary:
      type: object
      properties:
        total_accounts:
          type: integer
        active_accounts:
          type: integer
        inactive_accounts:
          type: integer
        students_taught:
          type: integer
        course_assignments:
          type: integer
      required:
      - active_accounts
      - course_assignments
      - inactive_accounts
      - students_taught
