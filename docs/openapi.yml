openapi: 3.0.3
info:
  title: ExamTaker API
  version: 1.0.0
  description: IT Academy uchun onlayn imtihon platformasi — backend API.
paths:
  /api/v1/admin/dashboard:
    get:
      operationId: v1_admin_dashboard_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/answers/{answer_id}/grade:
    patch:
      operationId: v1_answers_grade_partial_update
      description: OPEN_ENDED javobni baholaydi. Hamma javob baholangach attempt `GRADED`
        bo‘ladi va `score/percentage/passed` hisoblanadi. Baholangan javobni qayta
        baholash mumkin.
      parameters:
      - in: path
        name: answer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - grading
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGradeInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeResponse'
          description: ''
  /api/v1/attempts:
    get:
      operationId: v1_attempts_list
      description: 'Role bo‘yicha: Student — o‘ziniki, Teacher — o‘z kurslari, Super
        Admin — hammasi. Muddati o‘tgan faol attemptlar ro‘yxat olinishida avtomatik
        yopiladi.'
      parameters:
      - in: query
        name: assignment_id
        schema:
          type: string
          format: uuid
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - in: query
        name: exam_id
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - GRADED
          - IN_PROGRESS
          - PENDING_GRADING
          - SUBMITTED
        description: |-
          * `IN_PROGRESS` - In progress
          * `SUBMITTED` - Submitted
          * `PENDING_GRADING` - Pending grading
          * `GRADED` - Graded
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptListList'
          description: ''
  /api/v1/attempts/{id}:
    get:
      operationId: v1_attempts_retrieve
      description: 'Student: faol attempt — savollar+javoblar+taymer; yakunlangan
        — faqat natija (to‘g‘ri javoblarsiz). Teacher/Admin: javoblar va to‘g‘ri variantlar
        bilan.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
          description: ''
  /api/v1/attempts/{id}/answers/{exam_question_id}:
    put:
      operationId: v1_attempts_answers_update
      parameters:
      - in: path
        name: exam_question_id
        schema:
          type: string
          format: uuid
        description: ExamQuestion ID si (student DTO dagi savol `id` si)
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
          description: ''
  /api/v1/attempts/{id}/submit:
    post:
      operationId: v1_attempts_submit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        Tokensiz chaqiriladigan auth endpointlar.

        `get_authenticate_header` bo‘lmasa DRF 401 ni 403 ga aylantirib yuboradi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Refresh token bekor qilindi.
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Tokensiz chaqiriladigan auth endpointlar.

        `get_authenticate_header` bo‘lmasa DRF 401 ni 403 ga aylantirib yuboradi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/courses:
    get:
      operationId: v1_courses_list
      description: Kurslar. O‘qish — rolga qarab scoped; yozish — faqat Super Admin.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        description: |-
          * `ACTIVE` - Active
          * `ARCHIVED` - Archived
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
    post:
      operationId: v1_courses_create
      description: Kurslar. O‘qish — rolga qarab scoped; yozish — faqat Super Admin.
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
          description: ''
  /api/v1/courses/{course_pk}/groups:
    get:
      operationId: v1_courses_groups_list
      description: Guruhlar. O‘qish — Super Admin va kursga biriktirilgan teacher;
        yozish — Super Admin.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupList'
          description: ''
    post:
      operationId: v1_courses_groups_create
      description: Guruhlar. O‘qish — Super Admin va kursga biriktirilgan teacher;
        yozish — Super Admin.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
  /api/v1/courses/{course_pk}/groups/{group_pk}/students:
    get:
      operationId: v1_courses_groups_students_list
      description: |-
        `/courses/{course_pk}/...` resurslari uchun umumiy mantiq.

        * Kurs foydalanuvchiga ko‘rinmasa — 404.
        * `read_permission` — `read_actions` uchun, `write_permission` — qolganlari uchun.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: group_pk
        schema:
          type: string
          format: uuid
        description: Guruh ID si
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGroupStudentList'
          description: ''
    post:
      operationId: v1_courses_groups_students_create
      description: |-
        `/courses/{course_pk}/...` resurslari uchun umumiy mantiq.

        * Kurs foydalanuvchiga ko‘rinmasa — 404.
        * `read_permission` — `read_actions` uchun, `write_permission` — qolganlari uchun.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: group_pk
        schema:
          type: string
          format: uuid
        description: Guruh ID si
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupStudentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupStudent'
          description: ''
  /api/v1/courses/{course_pk}/groups/{group_pk}/students/{student_id}:
    delete:
      operationId: v1_courses_groups_students_destroy
      description: |-
        `/courses/{course_pk}/...` resurslari uchun umumiy mantiq.

        * Kurs foydalanuvchiga ko‘rinmasa — 404.
        * `read_permission` — `read_actions` uchun, `write_permission` — qolganlari uchun.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: group_pk
        schema:
          type: string
          format: uuid
        description: Guruh ID si
        required: true
      - in: path
        name: student_id
        schema:
          type: string
          format: uuid
        description: Student ID si
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Student guruhdan chiqarildi.
  /api/v1/courses/{course_pk}/groups/{id}:
    get:
      operationId: v1_courses_groups_retrieve
      description: Guruhlar. O‘qish — Super Admin va kursga biriktirilgan teacher;
        yozish — Super Admin.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    patch:
      operationId: v1_courses_groups_partial_update
      description: Guruhlar. O‘qish — Super Admin va kursga biriktirilgan teacher;
        yozish — Super Admin.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - groups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGroupWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
          description: ''
    delete:
      operationId: v1_courses_groups_destroy
      description: Guruhlar. O‘qish — Super Admin va kursga biriktirilgan teacher;
        yozish — Super Admin.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - groups
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Guruh o‘chirildi.
  /api/v1/courses/{course_pk}/modules:
    get:
      operationId: v1_courses_modules_list
      description: '`status` berilmasa, `ARCHIVED` modullar ko‘rsatilmaydi.'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        description: |-
          * `ACTIVE` - Active
          * `ARCHIVED` - Archived
      - in: query
        name: with_questions
        schema:
          type: boolean
        description: '`true` bo‘lsa har modul uchun savollar preview (faqat Teacher/Admin).'
      tags:
      - modules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedModuleList'
          description: ''
    post:
      operationId: v1_courses_modules_create
      description: 'Modullar course ichida shared: kursga biriktirilgan har qanday
        teacher tahrirlaydi.'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      tags:
      - modules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
  /api/v1/courses/{course_pk}/modules/{id}:
    get:
      operationId: v1_courses_modules_retrieve
      description: 'Modullar course ichida shared: kursga biriktirilgan har qanday
        teacher tahrirlaydi.'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - modules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
    patch:
      operationId: v1_courses_modules_partial_update
      description: 'Modullar course ichida shared: kursga biriktirilgan har qanday
        teacher tahrirlaydi.'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - modules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedModuleWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
          description: ''
    delete:
      operationId: v1_courses_modules_destroy
      description: 'Bo‘sh va ishlatilmagan modul o‘chiriladi (204). Savollar yoki
        imtihonlar bog‘langan bo‘lsa — `ARCHIVED` holatiga o‘tadi (200, `{"archived":
        true}`).'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - modules
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Modul o‘chirildi.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchivedResponse'
          description: ''
  /api/v1/courses/{course_pk}/students:
    get:
      operationId: v1_courses_students_list
      description: '`status` berilmasa, `REMOVED` holatdagilar ko‘rsatilmaydi.'
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - REMOVED
        description: |-
          * `ACTIVE` - Active
          * `COMPLETED` - Completed
          * `REMOVED` - Removed
      tags:
      - course-students
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnrollmentList'
          description: ''
    post:
      operationId: v1_courses_students_create
      description: |-
        `/courses/{course_pk}/...` resurslari uchun umumiy mantiq.

        * Kurs foydalanuvchiga ko‘rinmasa — 404.
        * `read_permission` — `read_actions` uchun, `write_permission` — qolganlari uchun.
      parameters:
      - in: path
        name: course_pk
        schema:
          type: string
          format: uuid
        description: Kurs ID si
        required: true
      tags:
      - course-students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
