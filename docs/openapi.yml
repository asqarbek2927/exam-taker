          type: string
          format: binary
          writeOnly: true
        phone_number:
          oneOf:
          - type: string
            pattern: ^\+998\d{9}$
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 255
        version:
          type: integer
          minimum: 1
      required:
      - version
    AdminAssignedCourse:
