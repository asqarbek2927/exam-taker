        my_students:
          type: integer
        my_questions:
          type: integer
        my_exams:
          type: integer
        active_assignments:
          type: integer
        pending_grading:
          type: integer
        average_student_score:
          type: number
          format: double
          nullable: true
      required:
      - active_assignments
      - average_student_score
      - my_courses
      - my_exams
      - my_groups
      - my_questions
      - my_students
      - pending_grading
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/UserStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - created_at
      - email
      - full_name
      - id
      - role
      - status
      - updated_at
    UserBrief:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
      required:
      - email
      - full_name
      - id
      - role
    UserCreateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
        role:
          $ref: '#/components/schemas/CreatableUserRoleEnum'
