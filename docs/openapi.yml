openapi: 3.0.3
info:
  title: ExamTaker API
  version: 1.0.0
  description: IT Academy uchun onlayn imtihon platformasi — backend API.
paths:
  /api/v1/admin/accounts:
    get:
      operationId: v1_admin_accounts_list
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - STUDENT
          - SUPER_ADMIN
          - SUPPORT_TEACHER
          - TEACHER
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `TEACHER` - Teacher
          * `SUPPORT_TEACHER` - Support Teacher
          * `STUDENT` - Student
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `DELETED` - Deleted
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminAccountList'
          description: ''
    post:
      operationId: v1_admin_accounts_create
      tags:
      - admin-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccountCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccountCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountCreateResponse'
          description: ''
  /api/v1/admin/accounts/{id}:
    get:
      operationId: v1_admin_accounts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
          description: ''
    put:
      operationId: v1_admin_accounts_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccountUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
          description: ''
    patch:
      operationId: v1_admin_accounts_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminAccountUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminAccountUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminAccountUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
          description: ''
    delete:
      operationId: v1_admin_accounts_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Account soft-delete qilindi.
  /api/v1/admin/accounts/{id}/activity:
    get:
      operationId: v1_admin_accounts_activity_list
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - STUDENT
          - SUPER_ADMIN
          - SUPPORT_TEACHER
          - TEACHER
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `TEACHER` - Teacher
          * `SUPPORT_TEACHER` - Support Teacher
          * `STUDENT` - Student
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `DELETED` - Deleted
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountActivityList'
          description: ''
  /api/v1/admin/accounts/{id}/courses:
    get:
      operationId: v1_admin_accounts_courses_list
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - STUDENT
          - SUPER_ADMIN
          - SUPPORT_TEACHER
          - TEACHER
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `TEACHER` - Teacher
          * `SUPPORT_TEACHER` - Support Teacher
          * `STUDENT` - Student
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `DELETED` - Deleted
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountCourseList'
          description: ''
  /api/v1/admin/accounts/{id}/photo:
    delete:
      operationId: v1_admin_accounts_photo_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      - in: query
        name: version
        schema:
          type: integer
        description: Accountning joriy optimistic-lock versiyasi.
        required: true
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
          description: ''
  /api/v1/admin/accounts/{id}/status:
    put:
      operationId: v1_admin_accounts_status_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminAccountStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminAccountStatusRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetail'
          description: ''
  /api/v1/admin/accounts/{id}/teaching-courses:
    put:
      operationId: v1_admin_accounts_teaching_courses_update
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - STUDENT
          - SUPER_ADMIN
          - SUPPORT_TEACHER
          - TEACHER
        description: |-
          * `SUPER_ADMIN` - Super Admin
          * `TEACHER` - Teacher
          * `SUPPORT_TEACHER` - Support Teacher
          * `STUDENT` - Student
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DELETED
          - INACTIVE
        description: |-
          * `ACTIVE` - Active
          * `INACTIVE` - Inactive
          * `DELETED` - Deleted
      tags:
      - admin-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeachingCoursesUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeachingCoursesUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeachingCoursesUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountCourseList'
          description: ''
  /api/v1/admin/accounts/{id}/temporary-password:
    post:
      operationId: v1_admin_accounts_temporary_password_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountCreateResponse'
          description: ''
  /api/v1/admin/accounts/summary:
    get:
      operationId: v1_admin_accounts_summary_retrieve
      parameters:
      - in: query
        name: role
        schema:
          enum:
          - TEACHER
          - SUPPORT_TEACHER
          type: string
          minLength: 1
        description: |-
          * `TEACHER` - TEACHER
          * `SUPPORT_TEACHER` - SUPPORT_TEACHER
        required: true
      tags:
      - admin-accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountRoleSummary'
          description: ''
  /api/v1/admin/dashboard:
    get:
      operationId: v1_admin_dashboard_retrieve
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboard'
          description: ''
  /api/v1/answers/{answer_id}/grade:
    patch:
      operationId: v1_answers_grade_partial_update
      description: OPEN_ENDED javobni baholaydi. Hamma javob baholangach attempt `GRADED`
        bo‘ladi va `score/percentage/passed` hisoblanadi. Baholangan javobni qayta
        baholash mumkin.
      parameters:
      - in: path
        name: answer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - grading
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGradeInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeResponse'
          description: ''
  /api/v1/attempts:
    get:
      operationId: v1_attempts_list
      description: 'Role bo‘yicha: Student — o‘ziniki, Teacher — o‘z kurslari, Super
        Admin — hammasi. Muddati o‘tgan faol attemptlar ro‘yxat olinishida avtomatik
        yopiladi.'
      parameters:
      - in: query
        name: assignment_id
        schema:
          type: string
          format: uuid
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
      - in: query
        name: exam_id
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - GRADED
          - IN_PROGRESS
          - PENDING_GRADING
          - SUBMITTED
        description: |-
          * `IN_PROGRESS` - In progress
          * `SUBMITTED` - Submitted
          * `PENDING_GRADING` - Pending grading
          * `GRADED` - Graded
      - in: query
        name: student_id
        schema:
          type: string
          format: uuid
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptListList'
          description: ''
  /api/v1/attempts/{id}:
    get:
      operationId: v1_attempts_retrieve
      description: 'Student: faol attempt — savollar+javoblar+taymer; yakunlangan
        — faqat natija (to‘g‘ri javoblarsiz). Teacher/Admin: javoblar va to‘g‘ri variantlar
        bilan.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
          description: ''
  /api/v1/attempts/{id}/answers/{exam_question_id}:
    put:
      operationId: v1_attempts_answers_update
      parameters:
      - in: path
        name: exam_question_id
        schema:
          type: string
          format: uuid
        description: ExamQuestion ID si (student DTO dagi savol `id` si)
        required: true
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
          description: ''
  /api/v1/attempts/{id}/events:
    post:
      operationId: v1_attempts_events_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptEventInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptEventResponse'
          description: ''
  /api/v1/attempts/{id}/submit:
    post:
      operationId: v1_attempts_submit_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        required: true
      tags:
      - attempts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        Tokensiz chaqiriladigan auth endpointlar.

        `get_authenticate_header` bo‘lmasa DRF 401 ni 403 ga aylantirib yuboradi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Refresh token bekor qilindi.
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Tokensiz chaqiriladigan auth endpointlar.

        `get_authenticate_header` bo‘lmasa DRF 401 ni 403 ga aylantirib yuboradi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/courses:
    get:
      operationId: v1_courses_list
      description: Kurslar. O‘qish — rolga qarab scoped; yozish — faqat Super Admin.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - DRAFT
        description: |-
          * `DRAFT` - Draft
          * `ACTIVE` - Active
          * `ARCHIVED` - Archived
      - in: query
        name: teacherId
        schema:
          type: string
          format: uuid
      - in: query
        name: teacher_id
        schema:
          type: string
          format: uuid
      tags:
      - courses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseListList'
          description: ''
