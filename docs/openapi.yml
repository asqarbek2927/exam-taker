  /api/v1/results:
    get:
      operationId: v1_results_list
      description: Yakunlangan attemptlar. Student — faqat o‘ziniki, Teacher — o‘z
        kurslari, Super Admin — hammasi. `latest_only=true` — har (assignment, student)
        uchun oxirgisi; `is_latest` — joriy natija shu attemptmi. `date_from/date_to`
        — sana (YYYY-MM-DD).
      parameters:
      - in: query
        name: assignment_id
        schema:
          type: string
          format: uuid
      - in: query
        name: course_id
        schema:
          type: string
          format: uuid
